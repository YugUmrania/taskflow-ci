# Practical 11 - Containerization with Docker and Docker Compose
# Starts the whole stack (React frontend + Express backend + MongoDB) with:
#   docker compose up --build
services:
  mongodb:
    image: mongo:7
    container_name: taskflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume so task data persists across container restarts.
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build: ./task-management-backend
    container_name: taskflow-backend
    restart: unless-stopped
    # Load backend secrets (OPENAI_API_KEY, ...) from the backend .env at
    # runtime. The .env is git/docker-ignored so it is never baked into the image.
    # `environment:` below still wins for MONGO_URI/PORT.
    env_file:
      - ./task-management-backend/.env
    environment:
      # Service name `mongodb` (NOT localhost) - containers talk over the
      # internal Docker network.
      MONGO_URI: mongodb://mongodb:27017/taskManagementDB
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build: ./task-management-frontend
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
